<div>

	<h1 class="title is-2">Hidden Behavior</h1>

	<p class="subtitle is-6">
		<code>c-hidden</code> sets the element's <code>hidden</code> property from a boolean expression.
		The element stays in the DOM (unlike <code>c-if</code>) but is not displayed.
	</p>

	<div class="box">

		<button type="button" class="button" data-testid="toggle" c-onclick="m().toggle()">Toggle</button>

		<p>hidden = <span data-testid="state">{{m().hidden}}</span></p>

		<p class="notification is-warning" c-hidden="m().hidden" data-testid="target">
			I can be hidden
		</p>

	</div>

</div>
