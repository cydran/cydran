<div>

	<h1 class="title is-2">Input Model Behavior (number)</h1>

	<p class="subtitle is-6">
		Two-way <code>c-model</code> on <code>&lt;input type="number"&gt;</code> — the model holds a
		<em>number</em> (bound via <code>el.valueAsNumber</code>).
	</p>

	<div class="box">

		<div class="field">
			<label class="label">Bound number input</label>
			<div class="control">
				<input type="number" step="any" class="input" data-testid="model-input" c-model="m().value">
			</div>
		</div>

		<p>Model value: <span data-testid="model-output">{{m().value}}</span></p>
		<p>value + 1 (proves it is numeric, not a string): <span data-testid="model-plusone">{{m().value + 1}}</span></p>

		<div class="buttons">
			<button type="button" class="button is-primary" data-testid="model-stamp" c-onclick="m().stamp()">Set model to 100</button>
			<button type="button" class="button" data-testid="model-zero" c-onclick="m().zero()">Set model to 0</button>
		</div>

	</div>

</div>
