<div>

	<h1 class="title is-2">Input Model Behavior (range)</h1>

	<p class="subtitle is-6">
		Two-way <code>c-model</code> on <code>&lt;input type="range"&gt;</code> — same NUMBER accessor
		strategy as <code>number</code>; the model holds a <em>number</em>.
	</p>

	<div class="box">

		<div class="field">
			<label class="label">Bound range (0&ndash;100, step 1)</label>
			<div class="control">
				<input type="range" min="0" max="100" step="1" class="slider" data-testid="model-input" c-model="m().value">
			</div>
		</div>

		<p>Model value: <span data-testid="model-output">{{m().value}}</span></p>
		<p>value + 1 (proves it is numeric): <span data-testid="model-plusone">{{m().value + 1}}</span></p>

		<div class="buttons">
			<button type="button" class="button is-primary" data-testid="model-stamp" c-onclick="m().stamp()">Set model to 75</button>
		</div>

	</div>

</div>
