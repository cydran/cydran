<div>

	<h1 class="title is-2">Input Model Behavior (select single)</h1>

	<p class="subtitle is-6">
		Two-way <code>c-model</code> on a single <code>&lt;select&gt;</code>
		(<code>MultiSelectValueModelBehavior</code>) — the model holds the selected option's
		<em>string</em> value.
	</p>

	<div class="box">

		<div class="field">
			<div class="select">
				<select data-testid="model-input" c-model="m().choice">
					<option value="red">Red</option>
					<option value="green">Green</option>
					<option value="blue">Blue</option>
				</select>
			</div>
		</div>

		<p>Model value: "<span data-testid="model-output">{{m().choice}}</span>"</p>

		<div class="buttons">
			<button type="button" class="button is-primary" data-testid="model-blue" c-onclick="m().pickBlue()">Set model to blue</button>
		</div>

	</div>

</div>
