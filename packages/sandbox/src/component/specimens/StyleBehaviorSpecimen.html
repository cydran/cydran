<div>

	<h1 class="title is-2">Style Behavior</h1>

	<p class="subtitle is-6">
		<code>c-style</code> takes an object of camelCase style properties
		(<code>{color: ..., fontWeight: ...}</code>) and applies each to the element's inline style.
	</p>

	<div class="box">

		<button type="button" class="button" data-testid="toggle" c-onclick="m().toggle()">Toggle</button>

		<p>color = <span data-testid="state-color">{{m().color}}</span>,
		   weight = <span data-testid="state-weight">{{m().weight}}</span></p>

		<p data-testid="target" c-style="{color: m().color, fontWeight: m().weight}">Styled text</p>

	</div>

</div>
